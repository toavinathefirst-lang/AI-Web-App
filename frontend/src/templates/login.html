<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Login</title>
  </head>
  <body class="bg-gray-100 antialiased font-sans">
  <!-- Navbar -->
    <nav class="bg-blue-600 p-4 text-white flex justify-between">
        <div>
            <h1 class="text-3xl font-bold">AI Blog Generator</h1>
        </div>
        <div>
            <a href="#" class="text-white hover:underline">Login</a>
            <a href="./signup.html" class="text-white hover:underline">Signup</a>
        </div>
    </nav>

     <!-- Main content -->
      <main class="flex items-center justify-center h-screen">
      <div class="bg-white p-8 shadow-md rounded-lg max-w-md w-full">

        <form class="space-y-4" action="" method="POST">

          <!-- Message d'erreur (à rendre dynamique plus tard) -->
          <div class="text-center text-red-600">
            <h2 class="font-semibold">Message d'erreur ici</h2>
          </div>

          <h2 class="text-xl font-semibold">Login</h2>

          <div>
            <label for="username" class="block mb-1 font-medium">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter your username..."
                   class="w-full p-2 border rounded">
          </div>

          <div>
            <label for="password" class="block mb-1 font-medium">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password..."
                   class="w-full p-2 border rounded">
          </div>

          <button type="submit"
                  class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
            Login
          </button>
        </form>

      </div>
    </main>

    <script type="module" src="../main.js"></script>

  </body>
</html>
